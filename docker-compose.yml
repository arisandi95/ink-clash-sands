services:
  mysql:
    image: mysql:8
    container_name: inkclash-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-inkclash}
      MYSQL_USER: ${DB_USER:-inkclash}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inkclash}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
